{% comment %}
  Live measurements of the fracture network drawn behind the page.
  Filled in by _scripts/fracture-readout.js; the dashes are what a visitor
  without JavaScript sees, which is honest rather than wrong.
{% endcomment %}

<dl class="readout" aria-label="Measurements of the fracture network drawn behind this page">
  <div class="readout-field">
    <dt>Traces</dt>
    <dd><span data-readout="traces">&mdash;</span></dd>
  </div>
  <div class="readout-field">
    <dt>Nodes</dt>
    <dd><span data-readout="nodes">&mdash;</span></dd>
  </div>
  <div class="readout-field">
    <dt>P<sub>21</sub></dt>
    <dd><span data-readout="p21">&mdash;</span> <em>m<sup>&minus;1</sup></em></dd>
  </div>
  <div class="readout-field">
    <dt>Sets</dt>
    <dd><span data-readout="sets">&mdash;</span></dd>
  </div>
  <div class="readout-field">
    <dt>Window</dt>
    <dd><span data-readout="span">&mdash;</span></dd>
  </div>
</dl>

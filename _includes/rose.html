{% comment %}
  Orientation rose diagram of the fracture network drawn behind the page,
  length-weighted and mirrored, because a trace has no sense of direction.
  Drawn by _scripts/fracture-readout.js.

  Optional parameter:  caption
{% endcomment %}

<figure class="rose-figure">
  <svg
    class="rose"
    viewBox="0 0 200 200"
    role="img"
    aria-label="Rose diagram of fracture trace orientations"
  ></svg>
  {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
